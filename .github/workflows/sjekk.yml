name: Sjekk

on:
  push:
  pull_request:

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: index.json, tokenverdier, nettadresser og topptekst
        run: python3 verktoy/sjekk.py
