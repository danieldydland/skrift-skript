; Standardkonfigurasjon for dagsliste.ahk: kopieres til config.ini i skriptmappen ved første kjøring (v0.10.4).
; Rediger config.ini, ikke denne. Ingen hemmeligheter her: tokenet ligger i filen under [skrift] tokenfil.
[webmed]
; Vindustittel i AHK-format (WinTitle)
vindu=WebMed ahk_exe TNW.Desktop.WPF.exe
; v0.6.1: ring henter mobilnummeret til pasienten fra WebMeds «Send SMS»-vindu
; (åpnes med sms_tast, leses via UIA og lukkes uten å sende)
sms_vindu=Send SMS ahk_exe TNW.Desktop.WPF.exe
sms_tast=^1
; v0.8.0: tasten som åpner meldingen til pasienten (Start Pasient Dialog); videolenken fra journalen kan limes inn der
melding_tast=^3

[filer]
; Relativt til skriptmappen, eller en full sti
eksempler=eksempler
logg=logg
; v0.10.2: 1 skriver JSON-filen med dagslisten (pasientbakgrunnen) også når send=1. Standard 0:
; ved sending holdes alt i minnet, og ingenting lagres på PC-en. Testene setter 1.
json_ved_sending=0

[kjoring]
; v0.6: Ctrl+Shift+F6 kjører dagslisten og Ctrl+Shift+F7 kalibrerer (Ctrl+Alt+D og
; Ctrl+Alt+K er «Velg diagnose» og «Pasient logg flytevindu» i WebMed)
hurtigtast=^+F6
avbryt=^!x
kalibrer=^+F7
; v0.6: de nye tastene (tom = av). Ikke WebMeds egne taster (WebMeds liste, side 1)
legemiddelgjennomgang=^+F9
lim_inn_melding=^+F10
ring=^+F11
video=^+F12
ny_innsjekk=^+F8
; v0.9: menyen med alle valgene ved musepekeren (Daniel 27.10 og 31.10): én enkel tast.
; F11 er ledig i WebMed (F1–F10 og F12 er WebMeds egne). Tallet velger linjen.
meny=F11
; v0.7: menyen også på et musetrykk i WebMed-vinduet (AHK-format, for eksempel ^RButton for
; Ctrl+høyreklikk). Tom = av. Prøv tasten i WebMed først: Ctrl+høyreklikk kan bety noe der
meny_mus=
; WebMeds egen tast for Avtaler («Gå til Kalender»). Tom = klikk på avtaler_meny som før v0.6
avtaler_tast={F3}
; Høyst 60 (grensen for én dagsliste i Skrift); v0.3 bruker aldri mer enn 60
maks_timer=40
; 1 = åpne «Lukk pasienter» og kontrollere navnet før feltene leses (anbefalt)
forhandskontroll=1
; Tasten som åpner «Lukk pasienter» for den aktive pasienten (v0.4, AHK-format).
; Tom = klikk på lukk_forste_fane som før v0.4 (virker bare uten andre åpne pasienter).
lukk_tast=!x
; Bare dagsliste.ahk (fra v0.2): skriptet leser datoen som er valgt i Avtaler,
; i dag eller senere. testdato (ÅÅÅÅ-MM-DD) tillater i tillegg denne ene
; passerte datoen, for en fiktiv testliste. Tom = bare i dag og senere.
testdato=

[koordinater]
; Vindusrelative piksler (AutoHotkey Window Spy, «Window»-koordinater),
; målt på 3440x1440, 100 % skalering, WebMed maksimert.
; Menyvalget «Avtaler» i toppmenyen
avtaler_meny=484,67
; Et punkt midt i hovednotatfeltet (Dagens)
notatfelt=1752,776
; Lukkeknappen (x) på den første pasientfanen
lukk_forste_fane=258,129
; Løpende journal (v0.4): x for fargelinjen i venstre marg av oppføringene,
; x for klikket i overskriften, y fra–til for listen, midten av boksen
; «Kontakt» i filteret, og fargen på overskriftene (heksadesimal RGB)
journal_skann_x=2351
journal_klikk_x=2860
journal_y=378,1382
journal_kontaktfilter=2690,366
journal_farge=E3E3E3

[innhold]
; v0.11.0: hva dagslisten henter fra journalen for hver time (1 = med, 0 = ikke).
; Timekommentaren fra Avtaler er alltid med. Velges også i menyen: Mer, Innhold i
; dagslisten. Legemiddelgjennomgangen fra menyen henter alltid legemiddellisten.
tidligere_sykdommer=1
familie_sosialt=1
legemiddelliste=1
; Siste konsultasjon fra Løpende journal (klikk i listen, krever kalibreringen)
siste_konsultasjon=1

[journal]
; Siste konsultasjon slås på og av under [innhold] (før v0.11.0: siste_konsultasjon her).
; Kontakttypene som teller, skilt med komma, som de står i overskriften i
; Løpende journal. «Konsultasjon» passer også «Konsultasjon (…)».
typer=Konsultasjon, Telefon konsultasjon
; Høyst så mange oppføringer sjekkes per pasient
maks_oppforinger=30
; Hjulhakk per side (48 px per hakk ved 100 % skalering; skal være under en skjermside)
rull_hakk=10
; 1 = sett filteret «Kontakt» før søket (WebMed nullstiller det når journalen åpnes på nytt)
kontaktfilter=1

[tider]
vent_journal_ms=1500
pause_mellom_timer_ms=300
; Som AHK-konvensjonen i handoffen: 2 s, deretter advarsel
utklipp_timeout_ms=2000
; Hvor lenge Ctrl+Alt+L får på seg (henting fra SFM kan ta flere sekunder)
vent_legemiddelliste_ms=8000

[skrift]
; Bare dagsliste.ahk (v0.2 og senere) bruker denne delen.
; Sending til Skrift (v0.3: hele dagslisten i én POST /mailbox/batch):
;   0 = av: bare tørrkjøring til JSON-filen (standard)
;   1 = på: sender hele dagslisten i én bunke etter at listen er lest, JSON-
;       filen er skrevet og alle poster er godkjent. Bare nøyaktig 1 slår den på.
; Ikke skriv kommentarer på samme linje som verdien.
send=1
; Filen med tokenet. Ligger utenfor skriptmappen, så tokenet aldri havner i en kopi av mappen.
; Innhold: én linje [skrift] og én linje token=skr_… (filen kan også bare
; inneholde tokenet). Tokenet trengs bare når send=1.
tokenfil=
; v0.11.1: proxy for kallene til Skrift. Tom = som Windows (PAC-skript eller manuell
; proxy, slik nettet ditt er satt opp, for eksempel NHN-nett), «ingen» = alltid
; direkte, «vert:port» = fast proxy. Verten logges, aldri tokenet.
proxy=
; v0.6: egne brytere for de nye funksjonene (send gjelder bare dagslisten).
; 0 = tørrkjøring (kroppen til logg\ eller i et vindu), 1 = send. Bare nøyaktig 1 slår på.
send_lmg=1
send_kommando=1

[melding]
; v0.6 (B2): meldingsvinduet i WebMed der meldingen til pasienten limes inn. Tom = gjenkjennes
; selv (Digital dialog: tittelen «… for NAVN fødselsnummer» og InitiateDialogControlView).
; Ellers en AHK WinTitle. tillat_notisblokk=1 tillater Notisblokk under test.
vindu=
tillat_notisblokk=0

